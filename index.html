<!doctype html>
<html lang="en">
  <head>
    <!-- 
    
      Key responsibilities:
      - Define the document structure and metadata.
      - Provide the <div id="root"> mount point for ReactDOM.
      - Load the main React entry file (main.jsx).
      - Set favicon and viewport settings for responsive design.
    -->

    <meta charset="UTF-8" />

    <!-- Favicon used by the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Ensures proper scaling and responsiveness on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title displayed in the browser tab -->
    <title>Wellness Tracker</title>
    <meta name="description" content="Track activity, sleep, hydration, meditation and appointments in one place." />
    <meta name="theme-color" content="#F28C1A" />

    <!-- Inter font (falls back to the system font if unavailable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- 
      React mounts the entire application into this root element.
      All components, pages, and routing logic are rendered inside this div.
    -->
    <div id="root"></div>

    <!-- 
      Load the main React entry file.
      Vite uses ES modules, so we import main.jsx directly.
      This file initializes React, wraps the app with providers, and renders <App />.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
